        // Slide 5: Coordinate Canvas Simulation
        function initCoordSimulation() {
            const canvas = document.getElementById('coordCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const originX = width / 2;
            const originY = height / 2;
            const scale = 20; // 20px per 1 unit

            function drawGrid(px = originX, py = originY) {
                ctx.clearRect(0, 0, width, height);

                // Grid lines
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 0.5;
                for (let x = 0; x <= width; x += scale) {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
                }
                for (let y = 0; y <= height; y += scale) {
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
                }

                // Sumbu X & Y
                ctx.strokeStyle = '#818cf8';
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(0, originY); ctx.lineTo(width, originY); ctx.stroke();
                ctx.strokeStyle = '#2dd4bf';
                ctx.beginPath(); ctx.moveTo(originX, 0); ctx.lineTo(originX, height); ctx.stroke();

                // Plot active point
                if (px !== null && py !== null) {
                    const mathX = Math.round((px - originX) / scale);
                    const mathY = Math.round((originY - py) / scale);

                    const snapPx = originX + mathX * scale;
                    const snapPy = originY - mathY * scale;

                    // Dashed projection lines
                    ctx.strokeStyle = '#f43f5e';
                    ctx.setLineDash([3, 3]);
                    ctx.beginPath(); ctx.moveTo(snapPx, originY); ctx.lineTo(snapPx, snapPy); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(originX, snapPy); ctx.lineTo(snapPx, snapPy); ctx.stroke();
                    ctx.setLineDash([]);

                    // Point
                    ctx.fillStyle = '#f43f5e';
                    ctx.beginPath(); ctx.arc(snapPx, snapPy, 6, 0, Math.PI * 2); ctx.fill();

                    // Text labels
                    document.getElementById('simCoordText').innerText = `(${mathX}, ${mathY})`;
                    
                    let qText = "Titik Asal (0,0)";
                    if (mathX > 0 && mathY > 0) qText = "Kuadran I";
                    else if (mathX < 0 && mathY > 0) qText = "Kuadran II";
                    else if (mathX < 0 && mathY < 0) qText = "Kuadran III";
                    else if (mathX > 0 && mathY < 0) qText = "Kuadran IV";
                    else if (mathX !== 0 || mathY !== 0) qText = "Sumbu Koordinat";

                    document.getElementById('simQuadrantText').innerText = qText;
                }
            }

            canvas.onclick = (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const px = (e.clientX - rect.left) * scaleX;
                const py = (e.clientY - rect.top) * scaleY;
                drawGrid(px, py);
            };

            drawGrid(originX + 3 * scale, originY - 2 * scale); // default A(3,2)

            const inputEl = document.getElementById('machineInputX');
            if (!inputEl) return;
            const val = parseFloat(inputEl.value) || 0;
            const result = 2 * val + 3;
            document.getElementById('machineProcess').innerText = `f(${val}) = 2(${val}) + 3`;
            document.getElementById('machineOutput').innerText = result;
        }

        const funcValueQuestions = [

            { q: "2. Jika $f(x) = x^2 - 4$, tentukan $f(3)$:", ans: 5 },
            { q: "3. Jika $f(x) = -3x + 5$, tentukan $f(2)$:", ans: -1 },
            { q: "4. Jika $f(x) = 2x^2 + x$, tentukan $f(-1)$:", ans: 1 },
            { q: "5. Jika $f(x) = \\frac{10}{x}$, tentukan $f(5)$:", ans: 2 }
        ];

        function initFuncValueQuiz() {
            const list = document.getElementById('funcValueQuizList');
            if (!list) return;
            list.innerHTML = funcValueQuestions.map((q, idx) => `
                <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">

                    </div>

        function checkFuncValAnswer(idx) {
            const input = document.getElementById(`fvAns_${idx}`);
            const status = document.getElementById(`fvStatus_${idx}`);
            const val = parseFloat(input.value);
            if (!isNaN(val) && val === funcValueQuestions[idx].ans) {
                status.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-400"></i>';
            } else if (input.value.trim() !== "") {
                status.innerHTML = '<i class="fa-solid fa-circle-xmark text-rose-400"></i>';
            } else {
                status.innerHTML = '';
            }
            updateFuncValScore();
        }

        function updateFuncValScore() {
            let score = 0;
            funcValueQuestions.forEach((q, idx) => {
                const input = document.getElementById(`fvAns_${idx}`);
                if (input && parseFloat(input.value) === q.ans) score++;
            });
            const scEl = document.getElementById('funcValueScore');
            if (scEl) scEl.innerText = `${score} / ${funcValueQuestions.length}`;
        }

        function resetFuncValueQuiz() {
            initFuncValueQuiz();
            updateFuncValScore();
        }

        // Slide 13: Graph Simulation Logic
        function drawGraphSimulation() {
            const canvas = document.getElementById('graphCanvas');
            const select = document.getElementById('graphFuncSelect');
            if (!canvas || !select) return;

            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            const ox = w / 2;
            const oy = h / 2;
            const scale = 25;

            ctx.clearRect(0, 0, w, h);

            // Grid
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 0.5;
            for (let x = 0; x <= w; x += scale) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
            }
            for (let y = 0; y <= h; y += scale) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
            }

            // Axes
            ctx.strokeStyle = '#818cf8'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(w, oy); ctx.stroke();
            ctx.strokeStyle = '#2dd4bf';
            ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, h); ctx.stroke();

            // Evaluate function: f(x)
            const type = select.value;
            const getF = (x) => {
                if (type === 'x+2') return x + 2;
                if (type === '2x') return 2 * x;
                if (type === 'x-1') return x - 1;
                if (type === '-x+3') return -x + 3;
                return x;
            };

            // Draw function line
            ctx.strokeStyle = '#f43f5e';
            ctx.lineWidth = 3;
            ctx.beginPath();
            for (let px = 0; px <= w; px++) {
                const mathX = (px - ox) / scale;
                const mathY = getF(mathX);
                const py = oy - mathY * scale;
                if (px === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.stroke();

            // Plot sample points x in [-3..3]
            for (let x = -3; x <= 3; x++) {
                const y = getF(x);
                const px = ox + x * scale;
                const py = oy - y * scale;

                ctx.fillStyle = '#f59e0b';
                ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2); ctx.fill();
            }
        }

        // Slide 14: Read Graph Quiz Logic
        function initReadGraphQuiz() {

                    <div class="flex gap-2 mt-1">

        function ansReadGraph(qNum, choice) {
            const key = { 1: -1, 2: 3, 3: 'A' };
            const isCorrect = choice === key[qNum];
            alert(isCorrect ? "Benar! Pembacaan grafik Anda tepat." : "Kurang tepat, coba perhatikan titik potong pada grafik.");
        }

        // Slide 17: Operation Simulator Calculation
        function calcOpSimulation() {
            const fVal = document.getElementById('opSelectF')?.value;
            const opVal = document.getElementById('opSelectType')?.value;
            const gVal = document.getElementById('opSelectG')?.value;

            const resEl = document.getElementById('opResultText');
            const noteEl = document.getElementById('opDomainNote');
            if (!resEl || !noteEl) return;

            let resultStr = "";
            let domainStr = "Domain terdefinisi untuk seluruh $x \\in \\mathbb{R}$.";

            if (opVal === 'add') {
                if (fVal === '2x+1' && gVal === 'x-3') resultStr = "(f + g)(x) = 3x - 2";
                else if (fVal === '3x-2' && gVal === '2x+5') resultStr = "(f + g)(x) = 5x + 3";
                else resultStr = "(f + g)(x) = ( " + fVal + " ) + ( " + gVal + " )";
            } else if (opVal === 'sub') {
                if (fVal === '2x+1' && gVal === 'x-3') resultStr = "(f - g)(x) = x + 4";
                else resultStr = "(f - g)(x) = ( " + fVal + " ) - ( " + gVal + " )";
            } else if (opVal === 'mul') {
                if (fVal === '2x+1' && gVal === 'x-3') resultStr = "(f \\cdot g)(x) = 2x^2 - 5x - 3";
                else resultStr = "(f \\cdot g)(x) = (" + fVal + ")(" + gVal + ")";
            } else if (opVal === 'div') {
                resultStr = "\\left(\\frac{f}{g}\\right)(x) = \\frac{" + fVal + "}{" + gVal + "}";
                domainStr = "<strong class='text-rose-400'>Syarat Domain:</strong> Penyebut $g(x) \\neq 0$.";
            }

            resEl.innerHTML = `$${resultStr}$`;
            noteEl.innerHTML = domainStr;

            if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([resEl, noteEl]);
        }

        // Slide 18: Group Answers Toggle
        function toggleGroupAnswers() {
            const boxes = document.querySelectorAll('.groupAnswerBox');
            boxes.forEach(b => b.classList.toggle('hidden'));
        }

        // Slide 19: Final Quiz Data & Logic
        const finalQuizQuestions = [
            { q: "Titik $P(-3, 5)$ terletak pada kuadran ke-...", options: ["Kuadran I", "Kuadran II", "Kuadran III", "Kuadran IV"], ans: 1 },
            { q: "Titik $Q(4, -2)$ terletak pada kuadran ke-...", options: ["Kuadran I", "Kuadran II", "Kuadran III", "Kuadran IV"], ans: 3 },
            { q: "Manakah notasi fungsi baku di bawah ini?", options: ["y = f(x)", "f = x(y)", "x = f(x)", "y(x) = x"], ans: 0 },
            { q: "Jika $f(x) = 3x - 5$, maka nilai $f(4)$ adalah...", options: ["5", "7", "12", "17"], ans: 1 },
            { q: "Jika $f(x) = x^2 + 2$, maka nilai $f(-3)$ adalah...", options: ["-7", "7", "11", "9"], ans: 2 },
            { q: "Himpunan semua nilai input $x$ yang diperbolehkan disebut...", options: ["Kodomain", "Domain", "Range", "Relasi"], ans: 1 },
            { q: "Jika $f(x) = 2x + 1$ dan $g(x) = x - 4$, bentuk $(f+g)(x)$ adalah...", options: ["3x - 3", "3x + 5", "x + 5", "2x - 3"], ans: 0 },
            { q: "Jika $f(x) = 2x + 1$ dan $g(x) = x - 4$, bentuk $(f-g)(x)$ adalah...", options: ["x - 3", "x + 5", "3x - 3", "x - 5"], ans: 1 },
            { q: "Pada fungsi pembagian $(f/g)(x) = \\frac{f(x)}{g(x)}$, syarat utamanya adalah...", options: ["f(x) = 0", "g(x) ≠ 0", "f(x) > 0", "g(x) > 0"], ans: 1 },
            { q: "Titik potong grafik $f(x) = x + 3$ dengan Sumbu-Y terjadi saat $x = 0$, yaitu di titik...", options: ["(0, 3)", "(3, 0)", "(0, -3)", "(-3, 0)"], ans: 0 }
        ];

        let userFinalAnswers = {};

        function initFinalQuiz() {
            const container = document.getElementById('finalQuizContainer');
            if (!container) return;

            container.innerHTML = finalQuizQuestions.map((q, idx) => `
                <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-3">
                    <p class="font-bold text-slate-200 text-sm">${idx + 1}. ${q.q}</p>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        ${q.options.map((opt, oIdx) => `
                            <button onclick="selectFinalOption(${idx}, ${oIdx})" id="fq_${idx}_${oIdx}" class="text-left p-2.5 rounded-lg border border-slate-800 bg-slate-900 text-xs text-slate-300 hover:border-indigo-500 transition">
                                <span class="font-bold text-indigo-400 mr-2">${String.fromCharCode(65 + oIdx)}.</span> ${opt}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([container]);
        }

        function selectFinalOption(qIdx, oIdx) {
            userFinalAnswers[qIdx] = oIdx;
            finalQuizQuestions[qIdx].options.forEach((_, optIdx) => {
                const btn = document.getElementById(`fq_${qIdx}_${optIdx}`);
                if (optIdx === oIdx) {
                    btn.className = "text-left p-2.5 rounded-lg border border-indigo-500 bg-indigo-600/20 text-indigo-200 text-xs font-semibold";
                } else {
                    btn.className = "text-left p-2.5 rounded-lg border border-slate-800 bg-slate-900 text-xs text-slate-400 opacity-60";
                }
            });
        }

        function submitFinalQuiz() {
            let correctCount = 0;
            finalQuizQuestions.forEach((q, idx) => {
                if (userFinalAnswers[idx] === q.ans) correctCount++;
            });

            const totalScore = (correctCount / finalQuizQuestions.length) * 100;
            document.getElementById('finalQuizScoreText').innerText = `${totalScore} / 100`;

            let category = "";
            let colorClass = "";
            if (totalScore >= 90) { category = "Sangat Baik"; colorClass = "text-emerald-400"; }
            else if (totalScore >= 80) { category = "Baik"; colorClass = "text-teal-400"; }
            else if (totalScore >= 70) { category = "Cukup"; colorClass = "text-amber-400"; }
            else { category = "Perlu Belajar Lagi"; colorClass = "text-rose-400"; }

            const badge = document.getElementById('finalQuizBadge');
            badge.innerHTML = `Kategori Hasil: <span class="${colorClass} font-bold text-sm">${category}</span> (${correctCount} dari 10 Benar)`;
        }

        // Global Event Listeners for Keyboard Navigation
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space') {
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                prevSlide();
            }
        });

        // Application Startup
        window.onload = function() {
            buildTocList();
            renderCurrentSlide();
        };
    </script>
